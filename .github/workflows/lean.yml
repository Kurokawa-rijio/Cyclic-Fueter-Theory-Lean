name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Lean project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        shell: bash
        run: |
          lake --version
          lake update

      - name: Get Mathlib cache
        shell: bash
        run: lake exe cache get

      # 作業ブランチでは新しいモジュールだけをビルドし、エラーを全部出し切る(main に入れる前に戻す)
      - name: Build new modules (keep going)
        shell: bash
        run: |
          set +e
          status=0
          for m in CFT.AlphaVII_Commutant CFT.AlphaVI_Sech CFT.AlphaVI_Static; do
            lake build $m 2>&1 | tee -a build.log
            [ "${PIPESTATUS[0]}" = "0" ] || status=1
          done
          grep -E -A8 "^error|error:" build.log > errors.txt || true
          { echo "## errors"; echo '```'; head -n 400 errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: errors
          path: errors.txt
