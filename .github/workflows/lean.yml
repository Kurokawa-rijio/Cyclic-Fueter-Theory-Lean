name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Lean project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        shell: bash
        run: |
          lake --version
          lake update

      - name: Get Mathlib cache
        shell: bash
        run: lake exe cache get

      - name: Build Lean project (phase 12 modules only)
        shell: bash
        run: |
          set +e
          set +o pipefail
          status=0
          for m in CFT.AlphaRoot_Junction CFT.AlphaRoot_Duality; do
            lake build $m 2>&1 | tee -a build.log
            [ "${PIPESTATUS[0]}" = "0" ] || status=1
          done
          exit $status

      - name: Axiom audit (every theorem)
        shell: bash
        run: |
          lake env lean scripts/check_phase12.lean > audit.txt 2>&1 || echo LEAN_FAILED >> audit.txt
          cat audit.txt
          total=$(grep -c "depends on axioms\|does not depend on any axioms" audit.txt || true)
          sorry=$(grep -c "sorryAx" audit.txt || true)
          std=$(grep -c "depends on axioms: \[propext, Classical.choice, Quot.sound\]" audit.txt || true)
          {
            echo "## Axiom audit"
            echo "- theorems audited: $total"
            echo "- depending only on [propext, Classical.choice, Quot.sound]: $std"
            echo "- using sorryAx: $sorry"
            echo '```'
            grep -v "depends on axioms: \[propext, Classical.choice, Quot.sound\]" audit.txt | head -n 50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$sorry" = "0"

      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit
          path: audit.txt
